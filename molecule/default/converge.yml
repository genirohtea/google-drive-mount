---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache on Debian Linux.
      ansible.builtin.apt:
        update_cache: True
        cache_valid_time: 600
      when: ansible_facts.os_family == 'Debian'

    - name: Wait for systemd to complete initialization. # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-system-running
      register: systemctl_status
      until: >
        'running' in systemctl_status.stdout or
        'degraded' in systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_facts.distribution == 'Fedora'
      changed_when: false

    # community.general.bitwarden_secrets_manager runs on the Ansible
    # controller and shells out to the `bws` CLI, so ensure it is
    # installed there (skipped when a `bws` binary is already present).
    - name: Check whether the bws CLI is already installed
      ansible.builtin.command: bws --version
      register: bws_installed
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false

    - name: Install the bws CLI
      when: bws_installed.rc != 0
      ansible.builtin.unarchive:
        src: "https://github.com/bitwarden/sdk-sm/releases/download/bws-v{{ bws_version }}/bws-x86_64-unknown-linux-gnu-{{ bws_version }}.zip"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      vars:
        bws_version: "2.1.0"
      delegate_to: localhost
      become: true

    - name: Show ansible version
      ansible.builtin.debug:
        msg: "Ansible Version: {{ ansible_version.full }}"


- name: example role by FQCN
  hosts: all
  collections:
    - genirohtea.google_drive_mount
  # tasks:
  #   - name: import role from a collection
  #     import_role:
  #       name: google_drive_mount

  roles:
    - role: google_drive_mount
      vars:
        folder_names:
          - test_folder/test_hostname
        site: "molecule"
        deploy_env: "test"
